name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build workspace
        run: pnpm -r build
      - name: Typecheck integration packages
        run: pnpm --filter terminal-browser --filter terminal-browser-cli --filter pi-terminal-browser run typecheck
      - name: Test integration packages
        run: pnpm --filter terminal-browser --filter terminal-browser-cli --filter pixel-store --filter pi-terminal-browser run test
      - name: Test native terminal transport
        run: cargo test --release --locked --manifest-path engine/Cargo.toml -p pixel-core terminal::tty_tests
      - name: Test managed distribution contracts
        run: pnpm test:dist
